<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle Analyse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card p-4 mx-auto" style="max-width: 600px;">
            <h2>Analyse Patient</h2>
            <hr>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for cat, msg in messages %}
                        <div class="alert alert-{{ cat }}">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data" action="/predict">
                <div class="mb-3">
                    <label class="form-label">Nom du patient</label>
                    <input class="form-control" type="text" name="name" placeholder="Ex: Jean Dupont" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Âge</label>
                    <input class="form-control" type="number" name="age" placeholder="Ex: 45" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Image de la lésion cutanée</label>
                    <input class="form-control" type="file" name="image" accept="image/*" required>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-success" type="submit">Lancer l'analyse</button>
                    <a href="/dashboard" class="btn btn-secondary">Retour</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
