<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Historique des Analyses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Historique des Analyses Patients</h2>
            <a href="/dashboard" class="btn btn-secondary">Retour au Dashboard</a>
        </div>
        <hr>
        
        <table class="table table-bordered table-striped bg-white shadow-sm mt-3 align-middle text-center">
            <thead class="table-dark">
                <tr>
                    <th>Nom du Patient</th>
                    <th>Âge</th>
                    <th>Résultat IA</th>
                    <th>Probabilité</th>
                    <th>Miniature Image</th>
                </tr>
            </thead>
            <tbody>
                {% for p in patients %}
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.age }} ans</td>
                    <td>
                        <span class="badge {% if p.result == 'Malignant' %}bg-danger{% else %}bg-success{% endif %} fs-6">
                            {{ p.result }}
                        </span>
                    </td>
                    <td>{{ (p.probability * 100) | round(2) }} %</td>
                    <td>
                        <img src="{{ url_for('static', filename='uploads/' + p.image_path.split('/')[-1]) }}" width="80" class="img-thumbnail" alt="Lésion">
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
